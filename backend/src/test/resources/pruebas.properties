# Valores fijos para las pruebas. Se cargan con @TestPropertySource, que tiene prioridad sobre backend/.env
# y sobre las variables de entorno: las pruebas no usan credenciales reales ni la red.
# El puerto 1 nunca tiene un PostgreSQL escuchando; el pool solo se abre si una prueba hace una consulta real.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/futdata_pruebas
spring.datasource.username=pruebas
spring.datasource.password=pruebas
futdata.cors.origins=http://localhost:5173
futdata.n8n.base-url=http://localhost:5678
futdata.n8n.webhook-token=token-de-prueba
# Sin Supabase: las pruebas de Storage usan un servidor simulado. Vacías para que backend/.env no las cambie.
futdata.supabase.url=
futdata.supabase.service-role-key=
