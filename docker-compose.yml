# Backend + n8n de FutData con un solo comando (HU-050): `docker compose up -d --build` desde la raíz del repositorio.
# Guía: sección "Levantar todo con un solo comando" del README.md raíz.
#
# Requiere Docker Compose 2.20 o superior (por `include`).
# Los secretos NO están aquí: van en backend/.env y n8n/.env, que Git ignora (se copian de los .env.example).
name: futdata

include:
  # El servicio n8n se reutiliza tal cual (n8n/docker-compose.yml sigue funcionando solo con `cd n8n && docker compose up`).
  # Sus rutas relativas (./workflows, ./logs) se resuelven desde n8n/. `env_file` indica de dónde salen las variables que
  # ese archivo interpola (${N8N_ENCRYPTION_KEY:?...}, ${N8N_WEBHOOK_TOKEN:?...}, ${SMTP_FROM:?...}).
  # El segundo archivo de `path` es un override que solo añade el healthcheck de n8n (no se puede redefinir n8n en este archivo
  # sin que Compose lo rechace como conflicto con el include, ni conviene editar n8n/).
  - path:
      - n8n/docker-compose.yml
      - docker-compose.n8n-healthcheck.yml
    env_file: n8n/.env

services:
  backend:
    build:
      context: ./backend
    container_name: futdata-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Todas las variables del backend (DB_*, CORS_ORIGINS, N8N_WEBHOOK_TOKEN...) salen de backend/.env.
    # Perfil de Spring: `local` por defecto, porque este compose es para desarrollo (arranca aunque falten Supabase o la
    # base de datos). Para probar `prod` (exige todas las variables): `SPRING_PROFILES_ACTIVE=prod docker compose up -d`.
    # `environment` gana sobre backend/.env y sobre el ENV de la imagen.
    env_file: backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # Dentro de Docker el backend llama a n8n por el nombre del servicio, no por localhost (que sería el propio contenedor).
      # Esto manda sobre N8N_BASE_URL de backend/.env.
      N8N_BASE_URL: http://n8n:5678
    # Solo orden de arranque: el backend no necesita a n8n para arrancar. Sin `condition: service_healthy`.
    depends_on:
      - n8n
