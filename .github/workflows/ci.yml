# Integración continua de FutData (HU-051).
# Se ejecuta en cada Pull Request hacia develop o main y en cada push a esas ramas.
# Si cualquier paso falla (lint, pruebas, compilación), el check queda en rojo y el PR no debe fusionarse.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Solo lectura: el pipeline no necesita escribir en el repositorio
permissions:
  contents: read

# Si se sube un commit nuevo a la misma rama, cancela la ejecución anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci instala exactamente lo que dice package-lock.json y falla si no coincide con package.json
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Compilar (build)
        run: npm run build

  # Pruebas y empaquetado del backend (TEC-01). Solo trabaja si el push o el PR cambian backend/** (o este
  # archivo); si no, termina en verde sin compilar. El job siempre se ejecuta para que el check exista
  # aunque no haya cambios de backend (un check requerido que nunca aparece bloquearía el PR).
  backend:
    name: Backend (compilar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          # Historial completo para comparar con la base del PR o con el push anterior
          fetch-depth: 0

      - name: Detectar cambios en el backend
        id: cambios
        working-directory: .
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # Sin un commit base para comparar (por ejemplo, una rama nueva): se prueba por si acaso
            echo "backend=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE" HEAD -- backend/ .github/workflows/ci.yml; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Backend::No hay cambios en backend/; no se compila el backend."
          else
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Java 21
        if: steps.cambios.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Compila, corre las pruebas (sin base de datos ni credenciales) y genera futdata-backend.jar
      - name: Pruebas y empaquetado
        if: steps.cambios.outputs.backend == 'true'
        run: ./mvnw -B -ntp verify
