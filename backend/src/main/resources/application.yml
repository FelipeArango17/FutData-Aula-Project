# Configuración del backend de FutData. Los valores salen de variables de entorno (ver backend/.env.example);
# aquí no va ningún secreto. Perfiles: "local" (por defecto, para desarrollo), "prod" (contenedor Docker) y "dev"
# (opcional, se suma a "local": publica la documentación OpenAPI). Ejemplo: SPRING_PROFILES_ACTIVE=local,dev

spring:
  application:
    name: futdata-backend
  profiles:
    default: local
  config:
    # Carga backend/.env si existe (formato KEY=valor, sin comillas). Las variables de entorno del sistema
    # tienen prioridad sobre el archivo. La segunda ruta sirve si se ejecuta desde la raíz del repositorio.
    import: "optional:file:.env[.properties],optional:file:backend/.env[.properties]"

  # PostgreSQL de Supabase por JDBC con SSL. El pool es HikariCP (ConexionPool en los diagramas del PPI).
  # El pool se abre con la primera consulta, así que la aplicación arranca aunque la base de datos no responda.
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: futdata-pool
      maximum-pool-size: ${DB_POOL_MAX:5}
      # Milisegundos (HikariCP no acepta "3s"). Tiempo máximo para obtener una conexión: corto, para que
      # /api/health responda rápido si la base de datos no está.
      connection-timeout: 3000
      validation-timeout: 2000
      # -1: crear el pool sin esperar a la primera conexión. Si no, cada consulta con la base caída esperaría
      # el timeout del driver (10 s) en vez de connection-timeout.
      initialization-fail-timeout: -1
      data-source-properties:
        # Segundos que el driver de PostgreSQL espera para abrir el socket (por defecto 10).
        connectTimeout: 3
  jdbc:
    template:
      query-timeout: 10s

  # Mensajes de validación en español, sin depender del idioma del navegador o del equipo.
  web:
    locale: es
    locale-resolver: fixed

  # Subida de archivos (foto del deportista). El límite de 5 MB lo aplica el servicio con un 400 de mensaje claro;
  # estos topes son más altos para que un archivo de poco más de 5 MB llegue al servicio. Lo que pase de 10 MB lo
  # rechaza Spring antes (400 por ManejadorGlobalErrores).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

# La documentación OpenAPI está apagada en todos los perfiles menos "dev" (ver el perfil dev al final y
# util.security.RutasSin2FA.DOCUMENTACION).
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  paths-to-match: /api/**

futdata:
  cors:
    # Orígenes permitidos, separados por coma.
    origins: ${CORS_ORIGINS}
  n8n:
    # Ver docs/info-sprints/sprint-2/contrato-webhook-notificaciones.md
    base-url: ${N8N_BASE_URL}
    webhook-token: ${N8N_WEBHOOK_TOKEN}
    timeout: 5s
    # Solo para ENLACE_CONTRASENA, que es síncrono (n8n responde después de enviar el correo). Ver N8nProperties.
    timeout-enlace: ${N8N_TIMEOUT_ENLACE:15s}
  frontend:
    # Dirección pública del frontend, sin barra final (config.FrontendProperties). Con ella se arma el enlace del correo
    # para crear la contraseña: {FRONTEND_URL}/crear-contrasena?token=... Obligatoria en prod. En local, si falta, el
    # alta funciona pero el correo no se envía (correoEnviado=false).
    url: ${FRONTEND_URL:}
  club:
    # Datos públicos del club que salen en los comprobantes y reportes en PDF (util.reports). No son secretos:
    # tienen valor por defecto en todos los perfiles y se cambian con variables de entorno. Si uno queda
    # vacío, esa línea no se imprime.
    nombre: ${CLUB_NOMBRE:Asociación Deportiva Prado Fútbol Club}
    nit: ${CLUB_NIT:811032309-1}
    direccion: ${CLUB_DIRECCION:Calle 40 Sur 75b-81, San Antonio de Prado, Medellín, Antioquia}
    telefono: ${CLUB_TELEFONO:3137317366}
    correo: ${CLUB_CORREO:pradofutbolclub@gmail.com}
  supabase:
    # Supabase Storage: comprobantes de pago en un bucket privado (datasource.external.SupabaseStorageClient).
    # La misma URL sirve para validar los JWT de Supabase Auth (util.security.JwtValidator).
    url: ${SUPABASE_URL}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
    bucket-comprobantes: ${SUPABASE_BUCKET_COMPROBANTES:comprobantes}
    vigencia-url-firmada: ${SUPABASE_VIGENCIA_URL_FIRMADA:5m}
    timeout: 10s
  wompi:
    # Pagos en línea con Wompi (sandbox por defecto). Sin llaves la app arranca y los endpoints de Wompi responden
    # 503 PAGOS_NO_CONFIGURADOS. Las llaves son secretas: solo variables de entorno, nunca en el repositorio ni en logs.
    public-key: ${WOMPI_PUBLIC_KEY:}
    private-key: ${WOMPI_PRIVATE_KEY:}
    events-secret: ${WOMPI_EVENTS_SECRET:}
    integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
    base-url: ${WOMPI_BASE_URL:https://sandbox.wompi.co/v1}
    redirect-url: ${WOMPI_REDIRECT_URL:}
    timeout: 10s
  mensualidad:
    # PENDIENTE: el monto real lo define el club. 0 = sin configurar (no se generan mensualidades).
    monto: ${FUTDATA_MENSUALIDAD_MONTO:0}
    dia-vencimiento: ${FUTDATA_MENSUALIDAD_DIA_VENCIMIENTO:5}
    generacion-automatica: ${FUTDATA_MENSUALIDAD_GENERACION_AUTOMATICA:false}
  cobros:
    # Cobros por ciclo de ingreso (config.CobrosCicloProperties): inscripción y uniforme al ingresar, días de anticipación del
    # cobro del ciclo y ventana (días desde el registro) en que se considera un ingreso nuevo. La mensualidad usa mensualidad.monto.
    inscripcion-monto: ${FUTDATA_COBROS_INSCRIPCION_MONTO:150000}
    uniforme-monto: ${FUTDATA_COBROS_UNIFORME_MONTO:90000}
    dias-anticipacion: ${FUTDATA_COBROS_DIAS_ANTICIPACION:5}
    ventana-ingreso-dias: ${FUTDATA_COBROS_VENTANA_INGRESO_DIAS:7}
  cron:
    # Token de la tarea diaria de n8n para POST /api/pagos/generar-ciclos (cabecera X-Cron-Token). OPCIONAL: sin valor, esa vía
    # queda deshabilitada y solo entra el administrador con su JWT. No es obligatoria en prod (config.CronProperties).
    token: ${N8N_CRON_TOKEN:}
  fotos:
    # Fotos de los deportistas (config.FotosProperties): bucket privado de la migración 007 y vigencia de la URL
    # firmada que va en las respuestas (de 10s a 60m). Separada de la de los comprobantes, que es corta.
    bucket: ${FOTOS_BUCKET:fotos}
    vigencia-url-firmada: ${FOTOS_VIGENCIA_URL_FIRMADA:60m}

---
# Perfil local: valores por defecto para poder trabajar sin credenciales.
# Sin DB_URL apunta a un PostgreSQL local; si no existe, /api/health responde 503 y el resto sigue funcionando.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}

futdata:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  n8n:
    base-url: ${N8N_BASE_URL:http://localhost:5678}
    webhook-token: ${N8N_WEBHOOK_TOKEN:}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

logging:
  level:
    co.edu.futdata: DEBUG

---
# Perfil prod: sin valores por defecto. Si falta DB_URL, DB_USER, DB_PASSWORD, CORS_ORIGINS, N8N_BASE_URL,
# N8N_WEBHOOK_TOKEN, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY o FRONTEND_URL, la aplicación no arranca y dice cuáles faltan
# (config.VerificadorVariablesProd).
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      data-source-properties:
        # SSL obligatorio si DB_URL no indica sslmode (si lo indica, manda el de la URL).
        sslmode: require

logging:
  level:
    root: INFO

---
# Perfil dev: solo publica la documentación OpenAPI (Swagger UI en /swagger-ui.html, sin token). Nunca en prod.
spring:
  config:
    activate:
      on-profile: dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
